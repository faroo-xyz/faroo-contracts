# Isolated tbPROS profile: FOUNDRY_PROFILE=tbpros forge build/test. Existing Hardhat config is unchanged.
[profile.tbpros]
src = "contracts/tbpros"
test = "test/tbpros/core-skeleton"
out = "cache/tbpros-core/out"
cache_path = "cache/tbpros-core/forge"
allow_paths = ["contracts/tbpros"]
libs = ["node_modules"]
remappings = ["tbpros/=contracts/tbpros/", "forge-std/=node_modules/forge-std/src/", "@openzeppelin/=node_modules/@openzeppelin/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
extra_output = ["storageLayout", "metadata"]
ast = true
fs_permissions = [{ access = "read", path = "reference/tbpros/calendar-fixtures.json" }]

[profile.tbpros.fuzz]
runs = 1024

[profile.tbpros.invariant]
runs = 128
depth = 64
fail_on_revert = true
